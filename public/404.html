<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script type="text/javascript">
      // 静态托管（GitHub Pages）没有服务端路由，直接访问 /zh-hk/、/en/
      // 等子路径或刷新页面时会先命中这个 404.html。这里把路径编码进
      // querystring 重定向回根目录，index.html 里的配套脚本再把它
      // 还原成真实路径交给 Vue Router 处理。
      // 参考：https://github.com/rafgraph/spa-github-pages
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
