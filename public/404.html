<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Static hosting (GitHub Pages) has no server-side routing, so a
      // direct visit to /zh-hk/, /en/, etc. or a page refresh hits this
      // 404.html first. This encodes the path into a querystring redirect
      // back to root; the counterpart script in index.html decodes it back
      // and hands it to Vue Router.
      // Reference: https://github.com/rafgraph/spa-github-pages
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
