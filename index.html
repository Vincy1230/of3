    <!-- 三个验证码不写死在代码里，构建时通过环境变量整体注入（见

    <meta name="baidu-site-verification" content="%VITE_BAIDU_SITE_VERIFICATION%" />

    <script type="text/javascript">
      // 配合 public/404.html 实现 GitHub Pages 上的 SPA 路径回退：
      // 404.html 把真实路径编码进 "?/" 查询串跳回根路径，这里在
      // Vue Router 接管前把它解码还原成真实路径。
      // 参考：https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="text/javascript">
      // 首屏防闪烁：main.css 只维护 [data-theme="dark"] 一份深色变量
      // （不再用 @media prefers-color-scheme 重复一份），所以这里必须
      // 在样式生效前就把"实际生效"的主题（auto 时按系统偏好解析）算好
      // 并写到 <html data-theme> 上，否则 auto + 系统深色的用户会先看到
      // 错误的浅色再跳变。这段逻辑需要和 useTheme.ts 保持一致。
      ;(function () {
        try {
          var stored = localStorage.getItem('of3:theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'auto'
          var resolved =
            mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode
          document.documentElement.dataset.theme = resolved
        } catch (e) {}
      })()
    </script>
