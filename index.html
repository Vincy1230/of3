    <script type="text/javascript">
      // Works with public/404.html to implement SPA path fallback on GitHub
      // Pages: 404.html encodes the real path into a "?/" query string and
      // bounces to the root; this decodes it back before Vue Router takes
      // over. Reference: https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="text/javascript">
      // Must stay in sync with useTheme.ts's theme-resolution logic, or
      // users on 'auto' will flash the wrong theme before it corrects.
      ;(function () {
        try {
          var stored = localStorage.getItem('of3:theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'auto'
          var resolved =
            mode === 'auto'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode
          document.documentElement.dataset.theme = resolved
        } catch (e) {}
      })()
    </script>
